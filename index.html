<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Системаи Бақайдгирии Лаборатория ва Рамзҳо</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #1c1e21; }
        .container { max-width: 1150px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; font-size: 26px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e4e6eb; padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { padding: 10px 18px; border: none; background: #e4e6eb; color: #4b4f56; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .tab-btn.active { background: #1a73e8; color: white; }
        .tab-btn:hover:not(.active) { background: #d8dadf; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: #f7f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #606770; }
        input, select { padding: 9px 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

        .btn-add { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; grid-column: 1 / -1; font-size: 15px; }
        .btn-add:hover { background: #218838; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #e4e6eb; padding: 10px; text-align: left; }
        th { background-color: #f7f9fa; color: #4b4f56; }
        tr:nth-child(even) { background-color: #fdfdfd; }

        .action-btns { display: flex; gap: 6px; }
        .btn-edit { background: #ffc107; color: #333; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-edit:hover { background: #e0a800; }
        .btn-delete:hover { background: #c82333; }

        .empty-row { text-align: center; color: #8d949e; font-style: italic; padding: 20px; }
        .code-badge { background: #e7f3ff; color: #1877f2; font-weight: bold; padding: 2px 8px; border-radius: 4px; border: 1px solid #b2d5ff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Системаи Бақайдгирии Лаборатория ва Рамзҳо</h2>

    <!-- Вкладкаҳо (Дафтарҳо) -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('биохимия')">Дафтари Биохимия</button>
        <button class="tab-btn" onclick="switchTab('рамз')">Дафтари Рамзҳо (ИФА)</button>
        <button class="tab-btn" onclick="switchTab('ифа2')">Дафтари ИФА 2</button>
        <button class="tab-btn" onclick="switchTab('общеклинический')">Общеклинический</button>
    </div>

    <!-- Формаи иловакунӣ -->
    <div class="form-grid">
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-group">
            <label>Ф.И.Ш. Пациент:</label>
            <input type="text" id="fullname" placeholder="Масалан: Иванов И.И.">
        </div>
        
        <div class="form-group">
            <label>Соли таваллуд / Синн:</label>
            <input type="text" id="age" placeholder="Масалан: 1990 / 34 сола">
        </div>

        <!-- Майдони Рамз танҳо барои дафтари Рамзҳо/ИФА намоён мешавад -->
        <div class="form-group" id="codeGroup">
            <label>Рамз (Код):</label>
            <select id="codeSelect" onchange="onCodeChange()">
                <option value="">-- Рамзро интихоб кунед --</option>
                <option value="101">101 - Тамос бо мубталоёни ВНМО</option>
                <option value="102">102 - Нашъамандони тазриқӣ</option>
                <option value="104">104 - Бемориҳои ҷинсӣ</option>
                <option value="106">106 - Муҳоҷирони меҳнатӣ</option>
                <option value="107">107 - Никоҳшавандагон</option>
                <option value="108">108 - Донорон</option>
                <option value="109">109 - Ҳомиладорон</option>
                <option value="111">111 - Мақомоти қудратӣ / Хизмат</option>
                <option value="113">113 - Аз рӯи нишонаҳои клиникӣ</option>
                <option value="120">120 - Кормандони соҳаи тиб</option>
                <option value="122">122 - Худ муроҷиат</option>
                <option value="custom">Дигар рамз...</option>
            </select>
            <input type="text" id="codeCustom" placeholder="Рамзро ворид кунед" style="display:none; margin-top:5px;">
        </div>

        <div class="form-group">
            <label>Намуди ташхис / Табақа:</label>
            <input type="text" id="analysisType" placeholder="Масалан: Глюкоза, ИФА ВГБ...">
        </div>

        <div class="form-group">
            <label>Дафтар / Категория:</label>
            <select id="categoryType">
                <option value="Глобали">Глобали</option>
                <option value="К 600">К 600</option>
                <option value="ИФА">ИФА</option>
            </select>
        </div>

        <div class="form-group">
            <label>Санаи ташхис (Холӣ мондан мумкин):</label>
            <input type="date" id="analysisDate">
        </div>

        <div class="form-group">
            <label>Натиҷа (Баъди ташхис пур кунед):</label>
            <input type="text" id="result" placeholder="Холӣ ё натиҷа">
        </div>

        <button class="btn-add" id="submitBtn" onclick="saveData()">Илова кардан</button>
    </div>

    <!-- Ҷадвали сабтҳо -->
    <table>
        <thead>
            <tr id="tableHeader">
                <!-- Бо JS пур мешавад -->
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Бо JS пур мешавад -->
        </tbody>
    </table>
</div>

<script>
    let currentTab = 'биохимия';
    let database = JSON.parse(localStorage.getItem('lab_db')) || {
        'биохимия': [],
        'рамз': [],
        'ифа2': [],
        'общеклинический': []
    };

    function onCodeChange() {
        const val = document.getElementById('codeSelect').value;
        const customInput = document.getElementById('codeCustom');
        if (val === 'custom') {
            customInput.style.display = 'block';
        } else {
            customInput.style.display = 'none';
        }
    }

    function renderTable() {
        const header = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (currentTab === 'рамз') {
            header.innerHTML = `
                <th style="width: 40px;">№</th>
                <th style="width: 80px;">Рамз</th>
                <th>Ф.И.Ш. Пациент</th>
                <th>Синн/Сол</th>
                <th>Табақа / Ташхис</th>
                <th>Дафтар</th>
                <th>Санаи ташхис</th>
                <th>Натиҷа</th>
                <th style="width: 130px;">Амалҳо</th>
            `;
            document.getElementById('codeGroup').style.display = 'flex';
        } else {
            header.innerHTML = `
                <th style="width: 40px;">№</th>
                <th>Ф.И.Ш. Пациент</th>
                <th>Синн/Сол</th>
                <th>Намуди ташхис</th>
                <th>Санаи ташхис</th>
                <th>Натиҷа</th>
                <th style="width: 130px;">Амалҳо</th>
            `;
            document.getElementById('codeGroup').style.display = 'none';
        }

        const list = database[currentTab] || [];

        if (list.length === 0) {
            const cols = currentTab === 'рамз' ? 9 : 7;
            tbody.innerHTML = `<tr><td colspan="${cols}" class="empty-row">Дар ин дафтар ҳоло ҳеҷ сабт нест.</td></tr>`;
            return;
        }

        list.forEach((item, index) => {
            const tr = document.createElement('tr');
            if (currentTab === 'рамз') {
                tr.innerHTML = `
                    <td><b>${index + 1}</b></td>
                    <td><span class="code-badge">${escapeHtml(item.code || '-')}</span></td>
                    <td>${escapeHtml(item.fullname)}</td>
                    <td>${escapeHtml(item.age)}</td>
                    <td>${escapeHtml(item.analysisType)}</td>
                    <td><b>${escapeHtml(item.categoryType || '-')}</b></td>
                    <td>${item.analysisDate ? item.analysisDate : '<i style="color:#aaa;">Гузошта نشده</i>'}</td>
                    <td>${item.result ? escapeHtml(item.result) : '<i style="color:#aaa;">Холӣ</i>'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editData(${index})">Таҳрир</button>
                            <button class="btn-delete" onclick="deleteData(${index})">Очӣ</button>
                        </div>
                    </td>
                `;
            } else {
                tr.innerHTML = `
                    <td><b>${index + 1}</b></td>
                    <td>${escapeHtml(item.fullname)}</td>
                    <td>${escapeHtml(item.age)}</td>
                    <td>${escapeHtml(item.analysisType)}</td>
                    <td>${item.analysisDate ? item.analysisDate : '<i style="color:#aaa;">Гузошта نشده</i>'}</td>
                    <td>${item.result ? escapeHtml(item.result) : '<i style="color:#aaa;">Холӣ</i>'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editData(${index})">Таҳрир</button>
                            <button class="btn-delete" onclick="deleteData(${index})">Очӣ</button>
                        </div>
                    </td>
                `;
            }
            tbody.appendChild(tr);
        });
    }

    function switchTab(tabName) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        resetForm();
        renderTable();
    }

    function saveData() {
        const fullname = document.getElementById('fullname').value.trim();
        const age = document.getElementById('age').value.trim();
        const analysisType = document.getElementById('analysisType').value.trim();
        const categoryType = document.getElementById('categoryType').value;
        const analysisDate = document.getElementById('analysisDate').value;
        const result = document.getElementById('result').value.trim();
        const editIndex = parseInt(document.getElementById('editIndex').value);

        let code = '';
        if (currentTab === 'рамз') {
            const sel = document.getElementById('codeSelect').value;
            code = sel === 'custom' ? document.getElementById('codeCustom').value.trim() : sel;
        }

        if (!fullname) {
            alert('Лутфан Ф.И.Ш. пациентро дохил кунед!');
            return;
        }

        const dataObj = { code, fullname, age, analysisType, categoryType, analysisDate, result };

        if (editIndex === -1) {
            database[currentTab].push(dataObj);
        } else {
            database[currentTab][editIndex] = dataObj;
        }

        localStorage.setItem('lab_db', JSON.stringify(database));
        resetForm();
        renderTable();
    }

    function editData(index) {
        const item = database[currentTab][index];
        document.getElementById('fullname').value = item.fullname || '';
        document.getElementById('age').value = item.age || '';
        document.getElementById('analysisType').value = item.analysisType || '';
        document.getElementById('categoryType').value = item.categoryType || 'Глобали';
        document.getElementById('analysisDate').value = item.analysisDate || '';
        document.getElementById('result').value = item.result || '';
        document.getElementById('editIndex').value = index;

        if (currentTab === 'рамз') {
            const sel = document.getElementById('codeSelect');
            if (['101','102','104','106','107','108','109','111','113','120','122'].includes(item.code)) {
                sel.value = item.code;
                document.getElementById('codeCustom').style.display = 'none';
            } else {
                sel.value = 'custom';
                document.getElementById('codeCustom').style.display = 'block';
                document.getElementById('codeCustom').value = item.code || '';
            }
        }

        document.getElementById('submitBtn').innerText = 'Сабт кардани тағйирот';
        document.getElementById('submitBtn').style.background = '#ffc107';
        document.getElementById('submitBtn').style.color = '#333';
    }

    function deleteData(index) {
        if (confirm('Оё мехоҳед ин сабтро очӣ (удалить) кунед?')) {
            database[currentTab].splice(index, 1);
            localStorage.setItem('lab_db', JSON.stringify(database));
            renderTable();
        }
    }

    function resetForm() {
        document.getElementById('fullname').value = '';
        document.getElementById('age').value = '';
        document.getElementById('analysisType').value = '';
        document.getElementById('categoryType').value = 'Глобали';
        document.getElementById('analysisDate').value = '';
        document.getElementById('result').value = '';
        document.getElementById('codeSelect').value = '';
        document.getElementById('codeCustom').value = '';
        document.getElementById('codeCustom').style.display = 'none';
        document.getElementById('editIndex').value = '-1';
        document.getElementById('submitBtn').innerText = 'Илова кардан';
        document.getElementById('submitBtn').style.background = '#28a745';
        document.getElementById('submitBtn').style.color = 'white';
    }

    function escapeHtml(text) {
        return text ? text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        }) : '';
    }

    renderTable();
</script>

</body>
</html>
