<!DOCTYPE html>
<html lang="tj">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Системаи Бақайдгирии Лабораторӣ</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #1c1e21; }
    .container { max-width: 1150px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { color: #1a73e8; text-align: center; margin-top: 0; font-size: 26px; }

    /* Поиск */
    .search-box { margin-bottom: 20px; position: relative; }
    .search-box label { font-size: 14px; font-weight: bold; color: #1a73e8; display: block; margin-bottom: 5px; }
    .search-box input { width: 100%; padding: 12px 15px; font-size: 15px; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; }
    .search-box input:focus { border-color: #1a73e8; }
    .results-list { max-height: 220px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; display: none; background: #fff; position: absolute; width: 100%; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .result-item { padding: 10px 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .result-item:hover { background-color: #e0f2fe; }
    .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; color: white; background: #1a73e8; }

    /* Вкладки */
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e4e6eb; padding-bottom: 10px; overflow-x: auto; }
    .tab-btn { padding: 10px 18px; border: none; background: #e4e6eb; color: #4b4f56; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .tab-btn.active { background: #1a73e8; color: white; }
    .tab-btn:hover:not(.active) { background: #d8dadf; }

    /* Форма */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: #f7f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #606770; }
    input, select { padding: 9px 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

    .btn-add { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; grid-column: 1 / -1; font-size: 15px; }
    .btn-add:hover { background: #218838; }

    /* Таблица */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #e4e6eb; padding: 10px; text-align: left; }
    th { background-color: #f7f9fa; color: #4b4f56; }
    tr:nth-child(even) { background-color: #fdfdfd; }

    .action-btns { display: flex; gap: 6px; }
    .btn-edit { background: #ffc107; color: #333; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-edit:hover { background: #e0a800; }
    .btn-delete:hover { background: #c82333; }

    .empty-row { text-align: center; color: #8d949e; font-style: italic; padding: 20px; }
    .code-badge { background: #e7f3ff; color: #1877f2; font-weight: bold; padding: 2px 8px; border-radius: 4px; border: 1px solid #b2d5ff; }
  </style>
</head>
<body>

<div class="container">
    <h2>Системаи Бақайдгирии Лаборатория ва Рамзҳо</h2>

    <!-- Ҷустуҷӯи Рамз ва Табақа -->
    <div class="search-box">
        <label for="searchInput">🔍 Ҷустуҷӯи Рамз ё Табақаи беморӣ:</label>
        <input type="text" id="searchInput" placeholder="Рамз ё номро ворид кунед (масалан: 101, 106, 113, 120, муҳоҷир, донор)..." oninput="handleSearch()">
        <div id="resultsList" class="results-list"></div>
    </div>

    <!-- Вкладкаҳо (Дафтарҳо) -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('биохимия')">Дафтари Биохимия</button>
        <button class="tab-btn" onclick="switchTab('рамз')">Дафтари Рамзҳо (ИФА)</button>
        <button class="tab-btn" onclick="switchTab('ифа2')">Дафтари ИФА 2</button>
        <button class="tab-btn" onclick="switchTab('общеклинический')">Общеклинический</button>
    </div>

    <!-- Формаи иловакунӣ -->
    <div class="form-grid">
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-group" id="codeGroup" style="display:none;">
            <label>Рамз (Код):</label>
            <input type="text" id="code" placeholder="Масалан: 101">
        </div>

        <div class="form-group">
            <label>Ф.И.Ш. Пациент:</label>
            <input type="text" id="fullname" placeholder="Масалан: Иванов И.И.">
        </div>
        
        <div class="form-group">
            <label>Соли таваллуд / Синн:</label>
            <input type="text" id="age" placeholder="Масалан: 1990 / 34 сола">
        </div>

        <div class="form-group">
            <label>Намуди ташхис / Табақа:</label>
            <input type="text" id="analysisType" placeholder="Масалан: Глюкоза, ИФА ВГБ...">
        </div>

        <div class="form-group">
            <label>Дафтар / Категория:</label>
            <input type="text" id="categoryType" placeholder="Глобали / К 600 / ИФА">
        </div>

        <div class="form-group">
            <label>Санаи ташхис (Холӣ мондан мумкин):</label>
            <input type="date" id="analysisDate">
        </div>

        <div class="form-group">
            <label>Натиҷа (Баъди ташхис пур кунед):</label>
            <input type="text" id="result" placeholder="Холӣ ё натиҷа">
        </div>

        <button class="btn-add" id="submitBtn" onclick="saveData()">Илова кардан</button>
    </div>

    <!-- Ҷадвали сабтҳо -->
    <table>
        <thead>
            <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let currentTab = 'биохимия';
    let database = JSON.parse(localStorage.getItem('lab_db')) || {
        'биохимия': [],
        'рамз': [],
        'ифа2': [],
        'общеклинический': []
    };

    const dbCodes = [
        { code: "101", name: "Шахсоне, ки бо мубталоёни ВНМО/БПНМ дар алоқаву тамос буданд", book: "Глобали" },
        { code: "101.1", name: "алоқаи ҷинсӣ", book: "Глобали" },
        { code: "101.2", name: "истифодаи якҷояи маводи нашъадори тазриқӣ", book: "Глобали" },
        { code: "101.3", name: "тамоси тиббӣ", book: "Глобали" },
        { code: "101.4", name: "кӯдакони аз модарони мубталои ВНМО таваллудшуда", book: "Глобали" },
        { code: "102", name: "Нашъамандони тазриқӣ", book: "Глобали" },
        { code: "103", name: "Гомо ва биссексуалҳо", book: "Глобали" },
        { code: "104", name: "Шахсоне, ки ба бемориҳои ҷинсӣ гирифторанд", book: "Глобали" },
        { code: "105", name: "Шахсони ба алоқаи ҷинсии бетартибона машғулбуда", book: "Глобали" },
        { code: "106", name: "Муҳоҷирони меҳнатӣ (зиёда аз 3 моҳ дар хориҷ)", book: "Глобали" },
        { code: "107", name: "Муоинаи тиббии ҳатмии шахсони никоҳшаванда", book: "Глобали" },
        { code: "108", name: "Донорони хун, зардоби хун ва дигар моеъҳо", book: "Глобали" },
        { code: "109", name: "Ҳомиладорон", book: "Глобали" },
        { code: "110", name: "Ресипиентҳои хун ва моеъҳои биологи", book: "Глобали" },
        { code: "111", name: "Кормандони мақомоти қудратӣ ва ба хизмат даъватшудагон", book: "Глобали" },
        { code: "112", name: "Шахсоне, ки дар маҳбасхонаҳо муоина шудаанд", book: "Глобали" },
        { code: "113", name: "Шахсони аз рўи нишонаҳои клиникӣ муоинашуда", book: "К 600" },
        { code: "113.1", name: "таби сабабаш номаълум", book: "К 600" },
        { code: "113.2", name: "дарунравии сабабаш номаълум", book: "К 600" },
        { code: "113.11", name: "сили шуш ва ғайришушӣ", book: "Глобали" },
        { code: "113.12", name: "зардпарвини С", book: "Глобали" },
        { code: "113.13", name: "зардпарвини В", book: "Глобали" },
        { code: "120", name: "Кормандони соҳаи тиб", book: "ИФА" },
        { code: "121", name: "Хонандагони мактабхои миёнаву олӣ", book: "К 600" },
        { code: "122", name: "Худ Муроҷиат", book: "К 600" }
    ];

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const resultsList = document.getElementById('resultsList');
        resultsList.innerHTML = '';

        if (query.length === 0) {
            resultsList.style.display = 'none';
            return;
        }

        const filtered = dbCodes.filter(item => 
            item.code.toLowerCase().includes(query) || 
            item.name.toLowerCase().includes(query) ||
            item.book.toLowerCase().includes(query)
        );

        if (filtered.length > 0) {
            resultsList.style.display = 'block';
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div><b>Рамз: ${item.code}</b> - ${item.name}</div>
                    <span class="badge">${item.book}</span>
                `;
                div.onclick = () => selectSearchResult(item);
                resultsList.appendChild(div);
            });
        } else {
            resultsList.style.display = 'none';
        }
    }

    function selectSearchResult(item) {
        document.getElementById('code').value = item.code;
        document.getElementById('analysisType').value = item.name;
        document.getElementById('categoryType').value = item.book;
        document.getElementById('resultsList').style.display = 'none';
        document.getElementById('searchInput').value = `${item.code} - ${item.name}`;

        // Автоматически переключить на вкладку "Дафтари Рамзҳо (ИФА)"
        const ramzBtn = document.querySelectorAll('.tab-btn')[1];
        switchTab('рамз', ramzBtn);
    }

    function renderTable() {
        const header = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (currentTab === 'рамз') {
            header.innerHTML = `
                <th style="width: 40px;">№</th>
                <th style="width: 80px;">Рамз</th>
                <th>Ф.И.Ш. Пациент</th>
                <th>Синн/Сол</th>
                <th>Табақа / Ташхис</th>
                <th>Дафтар</th>
                <th>Санаи ташхис</th>
                <th>Натиҷа</th>
                <th style="width: 130px;">Амалҳо</th>
            `;
            document.getElementById('codeGroup').style.display = 'flex';
        } else {
            header.innerHTML = `
                <th style="width: 40px;">№</th>
                <th>Ф.И.Ш. Пациент</th>
                <th>Синн/Сол</th>
                <th>Намуди ташхис</th>
                <th>Санаи ташхис</th>
                <th>Натиҷа</th>
                <th style="width: 130px;">Амалҳо</th>
            `;
            document.getElementById('codeGroup').style.display = 'none';
        }

        const list = database[currentTab] || [];

        if (list.length === 0) {
            const cols = currentTab === 'рамз' ? 9 : 7;
            tbody.innerHTML = `<tr><td colspan="${cols}" class="empty-row">Дар ин дафтар ҳоло ҳеҷ сабт нест.</td></tr>`;
            return;
        }

        list.forEach((item, index) => {
            const tr = document.createElement('tr');
            if (currentTab === 'рамз') {
                tr.innerHTML = `
                    <td><b>${index + 1}</b></td>
                    <td><span class="code-badge">${escapeHtml(item.code || '-')}</span></td>
                    <td>${escapeHtml(item.fullname)}</td>
                    <td>${escapeHtml(item.age)}</td>
                    <td>${escapeHtml(item.analysisType)}</td>
                    <td><b>${escapeHtml(item.categoryType || '-')}</b></td>
                    <td>${item.analysisDate ? item.analysisDate : '<i style="color:#aaa;">Гузошта نشده</i>'}</td>
                    <td>${item.result ? escapeHtml(item.result) : '<i style="color:#aaa;">Холӣ</i>'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editData(${index})">Таҳрир</button>
                            <button class="btn-delete" onclick="deleteData(${index})">Очӣ</button>
                        </div>
                    </td>
                `;
            } else {
                tr.innerHTML = `
                    <td><b>${index + 1}</b></td>
                    <td>${escapeHtml(item.fullname)}</td>
                    <td>${escapeHtml(item.age)}</td>
                    <td>${escapeHtml(item.analysisType)}</td>
                    <td>${item.analysisDate ? item.analysisDate : '<i style="color:#aaa;">Гузошта نشده</i>'}</td>
                    <td>${item.result ? escapeHtml(item.result) : '<i style="color:#aaa;">Холӣ</i>'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editData(${index})">Таҳрир</button>
                            <button class="btn-delete" onclick="deleteData(${index})">Очӣ</button>
                        </div>
                    </td>
                `;
            }
            tbody.appendChild(tr);
        });
    }

    function switchTab(tabName, btnTarget) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (btnTarget) {
            btnTarget.classList.add('active');
        } else {
            const btns = document.querySelectorAll('.tab-btn');
            if (tabName === 'биохимия') btns[0].classList.add('active');
            if (tabName === 'рамз') btns[1].classList.add('active');
            if (tabName === 'ифа2') btns[2].classList.add('active');
            if (tabName === 'общеклинический') btns[3].classList.add('active');
        }
        resetForm();
        renderTable();
    }

    function saveData() {
        const fullname = document.getElementById('fullname').value.trim();
        const age = document.getElementById('age').value.trim();
        const analysisType = document.getElementById('analysisType').value.trim();
        const categoryType = document.getElementById('categoryType').value.trim();
        const analysisDate = document.getElementById('analysisDate').value;
        const result = document.getElementById('result').value.trim();
        const code = document.getElementById('code').value.trim();
        const editIndex = parseInt(document.getElementById('editIndex').value);

        if (!fullname) {
            alert('Лутфан Ф.И.Ш. пациентро дохил кунед!');
            return;
        }

        const dataObj = { code, fullname, age, analysisType, categoryType, analysisDate, result };

        if (editIndex === -1) {
            database[currentTab].push(dataObj);
        } else {
            database[currentTab][editIndex] = dataObj;
        }

        localStorage.setItem('lab_db', JSON.stringify(database));
        resetForm();
        renderTable();
    }

    function editData(index) {
        const item = database[currentTab][index];
        document.getElementById('code').value = item.code || '';
        document.getElementById('fullname').value = item.fullname || '';
        document.getElementById('age').value = item.age || '';
        document.getElementById('analysisType').value = item.analysisType || '';
        document.getElementById('categoryType').value = item.categoryType || '';
        document.getElementById('analysisDate').value = item.analysisDate || '';
        document.getElementById('result').value = item.result || '';
        document.getElementById('editIndex').value = index;

        document.getElementById('submitBtn').innerText = 'Сабт кардани тағйирот';
        document.getElementById('submitBtn').style.background = '#ffc107';
        document.getElementById('submitBtn').style.color = '#333';
    }

    function deleteData(index) {
        if (confirm('Оё мехоҳед ин сабтро очӣ (удалить) кунед?')) {
            database[currentTab].splice(index, 1);
            localStorage.setItem('lab_db', JSON.stringify(database));
            renderTable();
        }
    }

    function resetForm() {
        document.getElementById('code').value = '';
        document.getElementById('fullname').value = '';
        document.getElementById('age').value = '';
        document.getElementById('analysisType').value = '';
        document.getElementById('categoryType').value = '';
        document.getElementById('analysisDate').value = '';
        document.getElementById('result').value = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('editIndex').value = '-1';
        document.getElementById('submitBtn').innerText = 'Илова кардан';
        document.getElementById('submitBtn').style.background = '#28a745';
        document.getElementById('submitBtn').style.color = 'white';
    }

    function escapeHtml(text) {
        return text ? text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        }) : '';
    }

    renderTable();
</script>

</body>
</html>
